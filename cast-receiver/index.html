<!doctype html>
<!--
  The EYZFlow Cast receiver: the page a Chromecast (or Google TV) loads when an
  EYZFlow player casts to it. It plays the stream the sender names and adds the
  DRM access-token header to every Widevine licence request, which Google's
  standard receiver cannot do.

  The sender (eyzflow_player, lib/src/cast/) sends a LOAD with:
    media.contentId    the stream id
    media.customData   {
      manifestUrl:  "https://stream.eyzflow.com/<id>/manifest.mpd",
      licenseUrl:   "https://api.eyzflow.com/v1/drm/<id>/widevine/acquire"  (absent for a clear stream),
      accessToken:  "<base64 access-token header>"                           (absent for a clear stream)
    }

  DASH with Widevine is the path the web player plays (Shaka), and the one the
  Cast framework plays natively, so the receiver takes the DASH manifest even
  though the phones play HLS. Both address the same encrypted segments.

  On a TV with a remote (Google TV, TVs with Chromecast built-in), Up or Menu
  opens a Subtitles / Audio menu over the player. Tracks switch through the
  framework's track managers, so the sender's media status (activeTrackIds)
  and its own menus follow. Without a remote no key arrives and the page looks
  as before.

  Host it over HTTPS and register its URL in the Google Cast SDK developer
  console as a Custom Receiver; the console's app id goes into the player
  (EYZFlowPlayer.castReceiverAppId, or cast.receiverAppId in a player config).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>EYZFlow</title>
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0a0a;
      }
      cast-media-player {
        /* The web player's default theme. */
        --theme-hue: 241;
        --progress-color: #615fff;
        --font-family: system-ui, sans-serif;
        --splash-image: none;
        --background-color: #0a0a0a;
      }
      /* The on-TV track menu. Sized in vh so it reads the same at 720p
         (Chromecast) and 1080p (Android TV). Hidden until a remote key opens it. */
      #tracks {
        position: fixed;
        top: 6vh;
        right: 4vw;
        z-index: 10;
        min-width: 28vw;
        max-height: 80vh;
        overflow: hidden;
        padding: 2vh 0;
        border-radius: 1.4vh;
        background: rgba(10, 10, 10, 0.88);
        color: #fff;
        font: 3vh/1.3 system-ui, sans-serif;
      }
      #tracks[hidden] {
        display: none;
      }
      #tracks h2 {
        margin: 1.2vh 0 0.4vh;
        padding: 0 3vh;
        font-size: 2.2vh;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.55);
      }
      #tracks .item {
        display: flex;
        align-items: center;
        gap: 1.5vh;
        padding: 0.9vh 3vh;
      }
      #tracks .item::before {
        content: "";
        width: 2.6vh;
        text-align: center;
      }
      #tracks .item.active::before {
        content: "\2713";
      }
      #tracks .item.focused {
        background: #615fff;
      }
      #tracks .note {
        color: rgba(255, 255, 255, 0.55);
        font-size: 2.4vh;
      }
    </style>
  </head>
  <body>
    <cast-media-player></cast-media-player>
    <div id="tracks" role="menu" hidden></div>
    <script>
      (() => {
        const framework = cast.framework;
        const context = framework.CastReceiverContext.getInstance();
        const player = context.getPlayerManager();

        // The access token of the media playing now: read per licence request,
        // so a new LOAD (next film, re-cast with a new session) takes over.
        let accessToken = null;

        player.setMessageInterceptor(framework.messages.MessageType.LOAD, (request) => {
          const media = request.media || {};
          const data = media.customData || {};
          accessToken = typeof data.accessToken === "string" ? data.accessToken : null;
          if (typeof data.manifestUrl === "string") {
            media.contentUrl = data.manifestUrl;
            media.contentType = "application/dash+xml";
          }
          media.streamType = framework.messages.StreamType.BUFFERED;
          request.media = media;
          return request;
        });

        player.setMediaPlaybackInfoHandler((loadRequest, playbackConfig) => {
          const data = (loadRequest.media && loadRequest.media.customData) || {};
          if (typeof data.licenseUrl === "string") {
            playbackConfig.protectionSystem = framework.ContentProtection.WIDEVINE;
            playbackConfig.licenseUrl = data.licenseUrl;
            playbackConfig.licenseRequestHandler = (request) => {
              request.headers = request.headers || {};
              if (accessToken) request.headers["access-token"] = accessToken;
            };
          }
          return playbackConfig;
        });

        // ---- On-TV subtitle and audio menu -------------------------------------
        //
        // A TV remote's D-pad reaches the page as keydown events. While the menu is
        // closed only the open keys (Up, Menu) are taken, so OK, Left and Right stay
        // with the stock player (play/pause, seek). While it is open every key is
        // taken. A device without a remote sends no keys, so nothing shows.
        const menuEl = document.getElementById("tracks");
        const CLOSE_AFTER_MS = 8000;
        const OPEN_KEYS = new Set(["ArrowUp", "ContextMenu", "Menu"]);
        const OPEN_CODES = new Set([38, 93]); // Up, ContextMenu
        const SELECT_KEYS = new Set(["Enter", " ", "Select"]);
        const SELECT_CODES = new Set([13, 23, 32]); // Enter, D-pad centre, Space
        const BACK_KEYS = new Set(["Escape", "Backspace", "GoBack", "BrowserBack"]);
        const BACK_CODES = new Set([4, 8, 27, 461, 10009]); // Android BACK, Backspace, Escape, webOS, Tizen

        const languageNames = (() => {
          try {
            return new Intl.DisplayNames([navigator.language || "en", "en"], { type: "language" });
          } catch (e) {
            return null;
          }
        })();

        const languageName = (code) => {
          if (!code) return "";
          try {
            const name = languageNames && languageNames.of(code);
            if (name && name !== code) return name.charAt(0).toUpperCase() + name.slice(1);
          } catch (e) {
            // An unknown tag: fall back to the tag itself.
          }
          return code;
        };

        // DASH role forced_subtitle (Shaka may also mark it as `forced-subtitle`).
        const isForced = (track) =>
          Array.isArray(track.roles) && track.roles.some((role) => /^forced[-_]subtitle$/.test(role));

        // Track names, else language names; repeated names get a number so a
        // film's stereo and 5.1 in one language can be told apart.
        const labelTracks = (tracks) => {
          const labels = tracks.map((track) => {
            let label = track.name || languageName(track.language) || `Track ${track.trackId}`;
            if (isForced(track) && !/forced/i.test(label)) label += " (forced)";
            return label;
          });
          const seen = {};
          return labels.map((label) => {
            const count = labels.filter((other) => other === label).length;
            if (count < 2) return label;
            seen[label] = (seen[label] || 0) + 1;
            return `${label} ${seen[label]}`;
          });
        };

        let items = []; // { label, active, pick } or { heading }
        let focus = -1;
        let closeTimer = null;

        const isOpen = () => !menuEl.hidden;

        const mediaLoaded = () => {
          const state = player.getPlayerState();
          return state && state !== framework.messages.PlayerState.IDLE;
        };

        // The menu's rows, read fresh from the track managers each time it opens,
        // so changes from the sender show.
        const buildItems = () => {
          const text = player.getTextTracksManager();
          const audio = player.getAudioTracksManager();
          let textTracks = [];
          let audioTracks = [];
          let activeText = [];
          let activeAudio = null;
          try {
            textTracks = text.getTracks() || [];
            activeText = text.getActiveIds() || [];
          } catch (e) {
            // No text tracks for this media.
          }
          try {
            audioTracks = audio.getTracks() || [];
            activeAudio = audio.getActiveId();
          } catch (e) {
            // No audio tracks for this media.
          }

          const rows = [];
          if (textTracks.length) {
            rows.push({ heading: "Subtitles" });
            const textOn = textTracks.some((t) => activeText.includes(t.trackId));
            rows.push({ label: "Off", active: !textOn, pick: () => text.setActiveByIds([]) });
            labelTracks(textTracks).forEach((label, i) => {
              const id = textTracks[i].trackId;
              rows.push({ label, active: activeText.includes(id), pick: () => text.setActiveByIds([id]) });
            });
          }
          if (audioTracks.length > 1) {
            rows.push({ heading: "Audio" });
            labelTracks(audioTracks).forEach((label, i) => {
              const id = audioTracks[i].trackId;
              const active = activeAudio === null ? i === 0 : activeAudio === id;
              rows.push({ label, active, pick: () => audio.setActiveById(id) });
            });
          }
          return rows;
        };

        const render = () => {
          menuEl.textContent = "";
          items.forEach((row, i) => {
            if (row.heading) {
              const h = document.createElement("h2");
              h.textContent = row.heading;
              menuEl.appendChild(h);
              return;
            }
            const el = document.createElement("div");
            el.className = "item" + (row.active ? " active" : "") + (i === focus ? " focused" : "");
            el.setAttribute("role", "menuitemradio");
            el.setAttribute("aria-checked", String(row.active));
            el.textContent = row.label;
            menuEl.appendChild(el);
            if (i === focus) el.scrollIntoView({ block: "nearest" });
          });
        };

        const restartCloseTimer = () => {
          clearTimeout(closeTimer);
          closeTimer = setTimeout(closeMenu, CLOSE_AFTER_MS);
        };

        const openMenu = () => {
          items = buildItems();
          const rows = items.filter((row) => !row.heading);
          if (!rows.length) return false;
          focus = items.findIndex((row) => !row.heading && row.active);
          if (focus < 0) focus = items.findIndex((row) => !row.heading);
          menuEl.hidden = false;
          render();
          restartCloseTimer();
          return true;
        };

        function closeMenu() {
          clearTimeout(closeTimer);
          menuEl.hidden = true;
          menuEl.textContent = "";
          items = [];
          focus = -1;
        }

        const moveFocus = (step) => {
          let next = focus;
          do {
            next += step;
          } while (next >= 0 && next < items.length && items[next].heading);
          if (next >= 0 && next < items.length) focus = next;
          render();
        };

        const pick = () => {
          const row = items[focus];
          if (!row || row.heading) return;
          try {
            row.pick();
            // The managers update the media status; send it now so the sender's
            // menus follow without waiting for the next status.
            player.broadcastStatus(true);
          } catch (e) {
            console.warn("[eyzflow-receiver] track switch failed", e);
          }
          closeMenu();
        };

        const matches = (event, keys, codes) => keys.has(event.key) || codes.has(event.keyCode);

        document.addEventListener(
          "keydown",
          (event) => {
            console.debug("[eyzflow-receiver] key", event.key, event.keyCode);
            if (!isOpen()) {
              if (!matches(event, OPEN_KEYS, OPEN_CODES) || !mediaLoaded()) return;
              if (!openMenu()) return;
            } else if (event.key === "ArrowUp" || event.keyCode === 38) {
              moveFocus(-1);
            } else if (event.key === "ArrowDown" || event.keyCode === 40) {
              moveFocus(1);
            } else if (matches(event, SELECT_KEYS, SELECT_CODES)) {
              pick();
            } else if (matches(event, BACK_KEYS, BACK_CODES) || matches(event, OPEN_KEYS, OPEN_CODES)) {
              closeMenu();
            }
            if (isOpen()) restartCloseTimer();
            event.preventDefault();
            event.stopImmediatePropagation();
          },
          true,
        );

        // A new film, or the end of one, closes the menu; its rows would be stale.
        player.addEventListener(
          [framework.events.EventType.MEDIA_FINISHED, framework.events.EventType.PLAYER_LOAD_COMPLETE],
          () => {
            closeMenu();
            logTracks();
          },
        );

        // What the framework lists, so a debug session shows whether forced
        // subtitles reach the text tracks manager.
        function logTracks() {
          try {
            const describe = (t) => ({ id: t.trackId, language: t.language, name: t.name, roles: t.roles, subtype: t.subtype });
            console.debug("[eyzflow-receiver] text tracks", (player.getTextTracksManager().getTracks() || []).map(describe));
            console.debug("[eyzflow-receiver] audio tracks", (player.getAudioTracksManager().getTracks() || []).map(describe));
          } catch (e) {
            // No tracks.
          }
        }

        context.addEventListener(framework.system.EventType.READY, () => {
          const caps = context.getDeviceCapabilities() || {};
          console.debug(
            "[eyzflow-receiver] dpad input",
            caps[framework.system.DeviceCapabilities.DPAD_INPUT_SUPPORTED],
          );
        });

        // Licence refusals carry the backend's code (STREAM_LIMIT, DEVICE_LIMIT,
        // PLAYER_KEY_INVALID, …); log it so a receiver debug session shows why.
        player.addEventListener(framework.events.EventType.ERROR, (event) => {
          console.warn("[eyzflow-receiver] error", event.detailedErrorCode, event.error);
        });

        const options = new framework.CastReceiverOptions();
        // Close the receiver after 10 idle minutes, as Google's own does.
        options.maxInactivity = 600;
        options.disableIdleTimeout = false;
        context.start(options);
      })();
    </script>
  </body>
</html>
