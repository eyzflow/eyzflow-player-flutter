name: eyzflow_player
description: >-
  EYZFlow player for Flutter apps: AVPlay on Tizen and the native player on
  Android and iOS, with the player key check, stream and device limits, and
  playback quality analytics.
version: 0.4.0
homepage: https://github.com/eyzflow/eyzflow-player-flutter
repository: https://github.com/eyzflow/eyzflow-player-flutter
issue_tracker: https://github.com/eyzflow/eyzflow-player-flutter/issues
topics:
  - video-player
  - drm
  - streaming
  - chromecast
  - tizen

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.41.9"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Pure-Dart mDNS for Chromecast discovery.
  multicast_dns: ^0.3.2
  video_player_avplay: ^0.8.14
  device_info_plus_tizen: ^1.2.0
  bloc: ^9.0.0
  flutter_bloc: ^9.0.0
  equatable: ^2.0.0
  get_it: ^9.2.0
  http: ^1.2.0
  # Google IMA (VAST/VMAP ads) on Android and iOS.
  interactive_media_ads: ^0.3.0+14
  intl: ^0.20.2
  meta: ^1.12.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  generate: true
  plugin:
    platforms:
      android:
        package: com.eyzflow.player
        pluginClass: EyzflowPlayerPlugin
      ios:
        pluginClass: EyzflowPlayerPlugin
